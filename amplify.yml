version: 1

frontend:
  phases:
    preBuild:
      commands:
        - corepack enable
        - pnpm install --frozen-lockfile

    build:
      commands:
        - env | grep -e RESEND_API_KEY -e EMAIL_ADDRESS >> .env.production
        - pnpm build

  artifacts:
    baseDirectory: .next
    files:
      - '**/*'

  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
